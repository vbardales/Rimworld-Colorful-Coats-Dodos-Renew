<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Dodos Preview composition</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:896px;height:504px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
body{background:url('Preview.png') center/cover no-repeat}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse 800px 620px at top left, rgb(var(--veil-rgb) / .96) 0%,rgb(var(--veil-rgb) / .90) 48%,rgb(var(--veil-rgb) / 0) 100%)}
main{position:absolute;left:50px;top:54px;color:var(--inkPrimary);text-shadow:0 3px 10px rgba(0,0,0,.75)}
h1{font-size:46px;font-weight:600;line-height:1.1;letter-spacing:0;width:460px}
h1 .suffix{font-size:.65em;color:var(--inkSecondary)}
.tag{width:max-content;margin-top:8px;font-size:24px;font-weight:400;line-height:1.1;letter-spacing:.2px;color:var(--inkSecondary)}
.rule{width:58px;height:3px;background:var(--accent);margin-top:20px;margin-bottom:16px}
.summary{font-size:21px;font-weight:400;line-height:1.45;letter-spacing:0;width:430px}
.badge{position:absolute;right:0;top:0;width:80px;height:80px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%)}
.version{position:absolute;left:869px;top:27px;transform:translate(-50%,-50%) rotate(45deg);font-size:26px;font-weight:700;line-height:1;color:var(--badgeInk)}
.background-only main{visibility:hidden}.background-only .version{visibility:hidden}
</style>
<div class="veil"></div>
<main><h1>Colorful Coats -<br>Dodos! <span class="suffix">Renew</span></h1><p class="tag">(unofficial)</p><div class="rule"></div><p class="summary">Seven coats for the dodo, instead of the one it hatches with.</p></main>
<div class="badge"></div><div class="version">1.6</div>
<script>
window.ready=(async()=>{
 const palette=await (await fetch('preview-palette.json')).json();
 for(const [key,value] of Object.entries(palette))document.documentElement.style.setProperty('--'+key,value);
 document.documentElement.style.setProperty('--veil-rgb',palette.veil.slice(1).match(/../g).map(v=>parseInt(v,16)).join(' '));
 await document.fonts.ready;
 await Promise.all([...document.images].map(i=>i.decode()));
})();
</script></html>
